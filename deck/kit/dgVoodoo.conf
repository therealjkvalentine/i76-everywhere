;;; Interstate '76 - dgVoodoo2 "max quality that works on Apple Silicon" (M-series)
;;; Chain: Glide -> dgVoodoo 2.78.2 -> D3D11 FL10.1 -> DXVK -> MoltenVK -> Metal
;;; Verified: this config loads, creates the FL10.1 device, and opens the render
;;; window without crashing on an M5 Pro. See docs/VISUAL-QUALITY-MAC.md.
[General]
OutputAPI                            = d3d11_fl11_0   ; was fl10_1 (MoltenVK-era); FL11_0 recommended, full on RADV/DXVK
FullScreenMode                       = true
ScalingMode                          = stretched   ; fill the Deck 16:10 (halfway 4:3<->16:9)
CaptureMouse                         = false   ; dgVoodoo default true confines the pointer to the 640x480 app area (measured on the Deck 2026-10-07)
Brightness                           = 100   ; was 115 (deck/setup-deck-wide.sh)

[GeneralExt]
FPSLimit                             = 0   ; was 20 (deck/setup-deck-wide.sh)
FullscreenAttributes                 = fake           ; no 640x480 mode change: present at the desktop 1280x800 (Proton otherwise pillarboxes)
Resampling                           = bilinear   ; was pointsampled (deck/setup-deck-wide.sh)

[Glide]
VideoCard                            = voodoo_graphics ; load-bearing: >2MB TMU => I76 "texture panic"
OnboardRAM                           = 2
MemorySizeOfTMU                      = 8192   ; was 2048 (deck/setup-deck-wide.sh)
NumberOfTMUs                         = 1
TMUFiltering                         = bilinear        ; authentic 3dfx smoothing (anisotropic is impossible for Glide by design)
Resolution                           = 1280x720   ; was 1280x800 (deck/setup-deck-wide.sh)
Antialiasing                         = 4x             ; MSAA. 4x guaranteed on Apple Silicon, cheap on TBDR. Fallback: appdriven (=off) if HUD corrupts
EnableGlideGammaRamp                 = true           ; *** THE brightness fix: honors I76's 3dfx gamma (shader pass, works on MoltenVK) ***
ForceVerticalSync                    = false
3DfxWatermark                        = false
3DfxSplashScreen                     = false
EnableInactiveAppState               = true

[GlideExt]
DitheringEffect                      = pure32bit       ; full 32-bit rendering: smooth skies, no 16-bit banding
Dithering                            = forcealways

[DirectX]
; DirectDraw path (the 2D menus/HUD/cutscene/salvage shell). Separate from [Glide].
VideoCard                            = ati_radeon_8500   ; advertises NO paletted support -> dgVoodoo does a full 32-bit palette conversion (fixes white->yellow / blue-drop on 8-bit 2D)
Resolution                           = unforced
DisableAltEnterToToggleScreenMode    = true
dgVoodooWatermark                    = false             ; the watermark is a DirectX-path key (this is the real off-switch)
