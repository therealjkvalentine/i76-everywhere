; Minimal ReShade 6.8 configuration for the I'76 renderer test copy (tools\renderers\renderer-matrix.ps1).
; switch-renderer.ps1 copies this next to i76.exe together with ReShade32.dll. Shaders, textures and the preset stay in
; refs\renderers\reshade (absolute paths), so nothing else has to be placed in the game folder.
[GENERAL]
EffectSearchPaths=%REFS%\reshade\Shaders
TextureSearchPaths=%REFS%\reshade\Textures
PresetPath=%REFS%\reshade\i76-cas-smaa.ini
PerformanceMode=1
NoReloadOnInit=0

[OVERLAY]
TutorialProgress=4
ShowClock=0
ShowFPS=0

[INPUT]
KeyOverlay=36,0,0,0
