# Interstate '76 internet relay settings (pyrelay.py reads this file; RUN-RELAY.bat and RELAY-FIREWALL.bat read the port too).
# Change a value after the = sign and start RUN-RELAY.bat again. Lines that start with # are notes.
[relay]

# The UDP port players connect to: the "port" in PLAY.bat --relay <your address>:<port>. The router's port forward and
# RELAY-FIREWALL.bat use the same number. 19900 unless you have a reason to change it.
port = 19900

# Which of this PC's addresses to listen on. 0.0.0.0 = all of them (needed for players from the internet).
bind = 0.0.0.0

# Who may join: empty = anyone who has the address. Or a comma-separated list of addresses / ranges, e.g.
#   allow = 10.1.2.0/24, 203.0.113.7
# (a friend's public address changes now and then; a refused player shows up in the log as "refused").
allow =

# Seconds of silence after which a player is dropped from the relay (a crashed or closed game).
idle timeout = 600

# quiet = only players joining / leaving / refused; info = also a traffic line every "stats every" seconds; debug = more.
log level = info
stats every = 10

# The log, beside this file unless you give a full path. Empty = the console window only.
log file = relay.log

# The Python the relay runs on (RUN-RELAY.bat and RELAY-FIREWALL.bat both use it). Empty = the "py" launcher, else "python".
# Give a full path (e.g. C:\Program Files\Python312\python.exe) to pin one: a Microsoft Store Python moves to a new folder at
# each update, and the firewall rule then no longer matches it (run RELAY-FIREWALL.bat again after an update).
python =
