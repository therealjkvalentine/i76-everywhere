# export_public.toml - allowlist for tools/export_public.py (dry run staging only; nothing here moves files into
# this repo). Globs are fnmatch over repo-relative posix paths; `*` also crosses `/`.
# Order of tests per tracked file: include (must match) -> [never] -> exclude -> needs_scrub -> denied extension.
# Classes (see the 2026-10-03 public-export inventory):
#   include      PUBLIC-SAFE candidates: our own code, prose/table docs, format specs, test scripts.
#   needs_scrub  public in principle, held back until edited: the gate found decompiler names/tokens in them.
#   never        never public: decompiler exports, game data and screenshots, third-party sources/media.

[staging]
out = "../i76-public-staging"          # outside every repo; I76_PUBLIC_STAGING overrides

[identity]
# Addresses that may appear in public text (commit trailers, generic placeholders).
allowed_emails = ["noreply@anthropic.com", "noreply@github.com", "user@example.com"]
# sha256 of the owner's lower-cased addresses: counted as owner_email, so the config never spells them out.
owner_email_sha256 = [
  "7b2e6373683d4cb1ca5a5fddae76a03a5277917794a694781ef3c1602a02c0be",
  "690c815fdb3061f1a9b1df8162b918f855b78f67fee7a6fe28c88dffab2c37b8",
  "08e80530bc9839e47cd44dabead4862c9230337ae653d610ac14ee938ba43efb",
]

[never]
globs = [
  "ghidra/export*",            # decompiler output (.c / .pcode), 18,022 files: Activision's code in another form
  "shell/ghidra/*",            # same, for the shell DLL
  "verify/queue/*",            # per-function decompile excerpts fed to the judges
  "status/blind/*",            # blind-pass rows quoting decompiled bodies
  "functions/history/*",       # proposal drafts incl. *.pcode.md
  "*.pcode.md",                # P-code listings of game functions
  "recon-2026-09-04/*",        # archive: third-party sources, ZFS/BWD2 samples, web sweep, toolchain media lists
  "captures/*",                # game screenshots (tracked .png/.bmp) and raw telemetry
  "sandbox-*",                 # game/CD extraction provenance
  "toolchain/*",               # Visual C++ media manifest
  "external/*",                # third-party clones (gitignored already)
  "data/out/*",                # game mission FSMs and outputs derived from game files
  "symbols/strings.tsv",       # the exe's string table (game text)
  "binaries/diff-*.tsv",       # byte clusters of the game exe
  "*/__pycache__/*",
  "*.pyc",
]

# ---------------------------------------------------------------------------------------------------------------
[[source]]
name = "lab"
repo = "../i76-uncap-lab"
env = "I76_LAB_ROOT"
dest = "lab"
include = ["*"]
exclude = []
needs_scrub = [
  # FUN_xxxxxxxx / DAT_ / local_ names in prose (rename to bare addresses or proposed names). All three already
  # exist, in some version, in i76-everywhere/docs/.
  "docs/MOUSE-ESC-MENU-AND-SAVE-SCREEN.md",
  "docs/WIDESCREEN-2D.md",
  "docs/WIDESCREEN-FEASIBILITY.md",
]

